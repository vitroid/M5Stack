[env:esp32-c3-supermini-front]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter =
	-<*.*>
	+<front/>
	+<common/>
lib_deps =
	fastled/FastLED
build_flags =
	-I src/common
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
monitor_filters =
	default
	esp32_exception_decoder

[env:esp32-c3-supermini-rear]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter =
	-<*.*>
	+<rear/>
	+<common/>
lib_deps =
	fastled/FastLED
build_flags =
	-I src/common
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
monitor_filters =
	default
	esp32_exception_decoder
