[env:m5stack-basic]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    m5stack/M5Stack
    ; 最新 FastLED は C++17 必須で旧 esp32 Arduino と衝突するため固定
    fastled/FastLED@3.6.0

build_flags =
    -DCORE_DEBUG_LEVEL=0

monitor_filters =
    default
    esp32_exception_decoder
