; PlatformIO — DOIT.AM ESP8266 NodeMCU Meross remote
; Flash:   pio run -t upload
; Monitor: pio device monitor -b 115200
; Combined: pio run -t upload -t monitor

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; Local secrets.h lives in include/ (gitignored). Copy from secrets.h.example.
; Optional: export WIFI_SSID / WIFI_PASSWORD / BRIDGE_HOST for inject_env.py.
extra_scripts = pre:inject_env.py

[env:esp12e]
extends = env:nodemcuv2
board = esp12e
